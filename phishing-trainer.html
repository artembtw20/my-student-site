        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            if (body.getAttribute('data-theme') === 'light') {
                body.removeAttribute('data-theme');
                icon.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                icon.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            }
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            const icon = document.getElementById('themeIcon');
            if (savedTheme === 'light') {
                document.body.setAttribute('data-theme', 'light');
                icon.textContent = '☀️';

        // ===== ОТОБРАЖЕНИЕ ВОПРОСА =====
        function renderQuestion() {
            const area = document.getElementById('questionArea');
            const stats = document.getElementById('resultArea');

            if (currentQuestionIndex >= questions.length) {
                showResult();
                return;
            }

            stats.style.display = 'none';
            const q = questions[currentQuestionIndex];

            // Обновляем статистику
            document.getElementById('totalQuestions').textContent = questions.length;
            document.getElementById('correctAnswers').textContent = correctCount;
            document.getElementById('wrongAnswers').textContent = wrongCount;
            const total = correctCount + wrongCount;
            document.getElementById('resultPercent').textContent = total === 0 ? '0%' : Math.round((correctCount / total) * 100) + '%';

            area.innerHTML = `
                    <div class="phishing-question">
                        <div class="phishing-question-title">${q.title}</div>
                        <div class="phishing-question-content">
                            ${q.content}
                        </div>
                        <div class="phishing-options">
                            ${q.options.map((opt, idx) => `
                                <button class="phishing-option" onclick="selectOption(${idx})" id="opt-${idx}">
                                    ${opt.text}
                                </button>
                            `).join('')}
                        </div>
                        <div id="feedbackArea" class="phishing-feedback" style="display: none;">
                            <div id="feedbackText" style="padding: 12px 16px; border-radius: var(--radius-small); margin-top: 12px;"></div>
                            <button class="generate-btn" onclick="nextQuestion()" style="width: auto; padding: 10px 30px; margin-top: 12px;">➡️ Следующий вопрос</button>
                        </div>
                    </div>
                `;

            answered = false;
        }

        // ===== ВЫБОР ОТВЕТА =====
        function selectOption(index) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestionIndex];
            const option = q.options[index];
            const feedback = document.getElementById('feedbackArea');
            const feedbackText = document.getElementById('feedbackText');

            // Блокируем кнопки
            document.querySelectorAll('.phishing-option').forEach((btn, i) => {
                btn.disabled = true;
                if (i === index) {
                    btn.classList.add(option.isCorrect ? 'correct' : 'wrong');
                } else if (q.options[i].isCorrect) {
                    btn.classList.add('correct-show');
                }
            });

            if (option.isCorrect) {
                correctCount++;
                feedbackText.style.background = 'rgba(39, 174, 96, 0.2)';
                feedbackText.style.color = '#27ae60';
                feedbackText.innerHTML = `✅ <strong>Правильно!</strong><br><span style="font-size: 14px; font-weight: 400;">${q.explanation}</span>`;
            } else {
                wrongCount++;
                const correctAnswer = q.options.find(o => o.isCorrect);
                feedbackText.style.background = 'rgba(231, 76, 60, 0.2)';
                feedbackText.style.color = '#e74c3c';
                feedbackText.innerHTML = `❌ <strong>Неправильно.</strong> Правильный ответ: <strong style="color: #27ae60;">${correctAnswer.text}</strong><br><span style="font-size: 14px; font-weight: 400;">${q.explanation}</span>`;
            }

            feedback.style.display = 'block';
            feedback.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ===== СЛЕДУЮЩИЙ ВОПРОС =====
        function nextQuestion() {
            currentQuestionIndex++;
            renderQuestion();
        }

        // ===== ПОКАЗАТЬ РЕЗУЛЬТАТ =====
        function showResult() {
            const area = document.getElementById('questionArea');
            const resultArea = document.getElementById('resultArea');
            const resultMsg = document.getElementById('resultMessage');

            area.innerHTML = '';

            const total = correctCount + wrongCount;
            const percent = total === 0 ? 0 : Math.round((correctCount / total) * 100);

            let message = '';
            let color = '#e74c3c';
            let icon = '😅';

            if (percent >= 80) {
                message = `Отлично! Вы распознали ${correctCount} из ${total} фишинговых писем! 🛡️`;
                color = '#27ae60';
                icon = '🏆';
            } else if (percent >= 60) {
                message = `Хороший результат! Вы распознали ${correctCount} из ${total} писем. Продолжайте тренироваться! 👏`;
                color = '#f39c12';
                icon = '👍';
            } else if (percent >= 40) {
                message = `Средний результат. ${correctCount} из ${total}. Рекомендуем повторить признаки фишинга. 📚`;
                color = '#e67e22';
                icon = '📖';
            } else {
                message = `Нужно больше практики! ${correctCount} из ${total}. Изучите признаки фишинговых писем. 🔍`;
                color = '#e74c3c';
                icon = '🔍';
            }

            resultMsg.innerHTML = `
                    <div style="font-size: 48px; margin-bottom: 12px;">${icon}</div>
                    <div style="color: ${color};">${message}</div>
                    <div style="font-size: 16px; font-weight: 400; color: var(--text-gray); margin-top: 8px;">
                        ✅ Правильно: ${correctCount} | ❌ Неправильно: ${wrongCount} | 📊 Результат: ${percent}%
                    </div>
                `;

            resultArea.style.display = 'block';
        }

        // ===== СБРОС =====
        function resetQuiz() {
            currentQuestionIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            document.getElementById('resultArea').style.display = 'none';
            renderQuestion();
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        window.onload = function () {
            loadTheme();
            renderQuestion();
            console.log('🎣 Тренажёр по фишингу загружен');
        };
    </script>
