        function toggleTheme() {
            const body = document.body;

                body.removeAttribute('data-theme');
                icon.setAttribute('data-lucide', 'moon');

            } else {
                body.setAttribute('data-theme', 'light');
                icon.setAttribute('data-lucide', 'sun');
                localStorage.setItem('theme', 'light');
            }
            refreshIcons();
        }

            const savedTheme = localStorage.getItem('theme');

                options: [

                    <div style="display: flex; justify-content: space-between; color: var(--text-gray); font-size: 13px; margin-bottom: 8px; flex-wrap:wrap; gap:8px;">

                options: [
                    { text: 'Это официальное письмо от ГИБДД', isCorrect: false },

                    { text: 'Нужно проверить на сайте Госуслуг', isCorrect: false }
                ],

            }
        ];

        // ============================================
        // РЕНДЕР ВОПРОСА
        // ============================================
        function renderQuestion() {
            const area = document.getElementById('questionArea');
            const stats = document.getElementById('resultArea');

            if (currentQuestionIndex >= questions.length) {
                showResult();
                return;
            }

            stats.style.display = 'none';
            const q = questions[currentQuestionIndex];

            document.getElementById('totalQuestions').textContent = questions.length;
            document.getElementById('correctAnswers').textContent = correctCount;
            document.getElementById('wrongAnswers').textContent = wrongCount;
            const total = correctCount + wrongCount;
            document.getElementById('resultPercent').textContent = total === 0 ? '0%' : Math.round((correctCount / total) * 100) + '%';

            area.innerHTML = `
                    <div class="phishing-question">
                        <div class="phishing-question-title">
                            <i data-lucide="mail" style="width:18px;height:18px;vertical-align:-3px;"></i>
                            ${q.title}
                        </div>
                        <div class="phishing-question-content">
                            ${q.content}
                        </div>
                        <div class="phishing-options">
                            ${q.options.map((opt, idx) => `
                                <button class="phishing-option" onclick="selectOption(${idx})" id="opt-${idx}">
                                    ${opt.text}
                                </button>
                            `).join('')}
                        </div>
                        <div id="feedbackArea" class="phishing-feedback" style="display: none;">
                            <div id="feedbackText" style="padding: 12px 16px; border-radius: var(--radius-small); margin-top: 12px;"></div>
                            <button class="generate-btn" onclick="nextQuestion()" style="width: auto; padding: 10px 30px; margin-top: 12px; display:inline-flex; align-items:center; gap:6px; font-family:inherit;">
                                <i data-lucide="arrow-right" style="width:16px;height:16px;"></i>
                                Следующий вопрос
                            </button>
                        </div>
                    </div>
                `;

            answered = false;
            refreshIcons();
        }

        // ============================================
        // ВЫБОР ОТВЕТА
        // ============================================
        function selectOption(index) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestionIndex];
            const option = q.options[index];
            const feedback = document.getElementById('feedbackArea');
            const feedbackText = document.getElementById('feedbackText');

            document.querySelectorAll('.phishing-option').forEach((btn, i) => {
                btn.disabled = true;
                if (i === index) {
                    btn.classList.add(option.isCorrect ? 'correct' : 'wrong');
                } else if (q.options[i].isCorrect) {
                    btn.classList.add('correct-show');
                }
            });

            if (option.isCorrect) {
                correctCount++;
                feedbackText.style.background = 'rgba(39, 174, 96, 0.2)';
                feedbackText.style.color = '#27ae60';
                feedbackText.innerHTML = `<div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                    <i data-lucide="check-circle-2" style="width:20px;height:20px;"></i>
                    <strong>Правильно!</strong>
                </div><span style="font-size: 14px; font-weight: 400;">${q.explanation}</span>`;
            } else {
                wrongCount++;
                const correctAnswer = q.options.find(o => o.isCorrect);
                feedbackText.style.background = 'rgba(231, 76, 60, 0.2)';
                feedbackText.style.color = '#e74c3c';
                feedbackText.innerHTML = `<div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
                    <i data-lucide="x-circle" style="width:20px;height:20px;"></i>
                    <strong>Неправильно.</strong> Правильный ответ: <span style="color: #27ae60; margin-left:4px;">${correctAnswer.text}</span>
                </div><span style="font-size: 14px; font-weight: 400;">${q.explanation}</span>`;
            }

            feedback.style.display = 'block';
            feedback.scrollIntoView({ behavior: 'smooth', block: 'center' });
            refreshIcons();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            renderQuestion();
        }

        // ============================================
        // ПОКАЗАТЬ РЕЗУЛЬТАТ
        // ============================================
        function showResult() {
            const area = document.getElementById('questionArea');
            const resultArea = document.getElementById('resultArea');
            const resultMsg = document.getElementById('resultMessage');

            area.innerHTML = '';

            const total = correctCount + wrongCount;
            const percent = total === 0 ? 0 : Math.round((correctCount / total) * 100);

            let message = '';
            let color = '#e74c3c';
            let icon = 'frown';

            if (percent >= 80) {
                message = `Отлично! Вы распознали ${correctCount} из ${total} фишинговых писем!`;
                color = '#27ae60';
                icon = 'trophy';
            } else if (percent >= 60) {
                message = `Хороший результат! Вы распознали ${correctCount} из ${total} писем. Продолжайте тренироваться!`;
                color = '#f39c12';
                icon = 'thumbs-up';
            } else if (percent >= 40) {
                message = `Средний результат. ${correctCount} из ${total}. Рекомендуем повторить признаки фишинга.`;
                color = '#e67e22';
                icon = 'book-open';
            } else {
                message = `Нужно больше практики! ${correctCount} из ${total}. Изучите признаки фишинговых писем.`;
                color = '#e74c3c';
                icon = 'search';
            }

            resultMsg.innerHTML = `
                    <div style="margin-bottom: 12px;"><i data-lucide="${icon}" style="width:48px;height:48px;color:${color};"></i></div>
                    <div style="color: ${color};">${message}</div>
                    <div style="font-size: 16px; font-weight: 400; color: var(--text-gray); margin-top: 8px; display:flex; justify-content:center; gap:16px; flex-wrap:wrap;">
                        <span><i data-lucide="check-circle-2" style="width:14px;height:14px;vertical-align:-2px;color:#27ae60;"></i> Правильно: ${correctCount}</span>
                        <span><i data-lucide="x-circle" style="width:14px;height:14px;vertical-align:-2px;color:#e74c3c;"></i> Неправильно: ${wrongCount}</span>
                        <span><i data-lucide="bar-chart-3" style="width:14px;height:14px;vertical-align:-2px;"></i> Результат: ${percent}%</span>
                    </div>
                `;

            resultArea.style.display = 'block';
            refreshIcons();
        }

        function resetQuiz() {
            currentQuestionIndex = 0;
            correctCount = 0;
            wrongCount = 0;
            document.getElementById('resultArea').style.display = 'none';
            renderQuestion();
        }

        window.onload = function () {
            loadTheme();
            renderQuestion();
            refreshIcons();
            console.log('Тренажёр по фишингу загружен');
        };
    </script>

    <script src="header.js"></script>

</body>
