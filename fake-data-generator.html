<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор фейковых данных</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== ШАПКА ===== -->
    <div class="header">
        <div class="logo">
            <img src="10837270.png" alt="Логотип">
            <span id="headerName">Беккер Артём</span>
        </div>
        <div class="nav">
            <a href="index.html">🏠 Главная</a>
            <a href="sitemap.html">🗺️ Все разделы</a>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle" title="Переключить тему">
                <span id="themeIcon">🌙</span>
            </button>
        </div>
    </div>

    <!-- ===== КОНТЕЙНЕР ===== -->
    <div class="container">
        <div class="page-card" style="text-align: left; align-items: stretch;">

            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
                <div>
                    <h1 style="font-size: 28px; color: var(--text-white);">🎭 Генератор фейковых данных</h1>
                    <p class="subtitle" style="font-size: 15px;">Создаёт вымышленные, но реалистичные данные для защиты приватности</p>
                </div>
                <a href="sitemap.html" class="back-link" style="font-size: 14px;">← Назад</a>
            </div>

            <div class="divider" style="margin: 0 0 20px 0; width: 60px;"></div>

            <!-- ===== КНОПКИ ===== -->
            <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;">
                <button class="generate-btn" onclick="generateAll()" style="width:auto; padding:12px 30px;">🎲 Сгенерировать всё</button>
                <button class="generate-btn" onclick="copyAll()" style="width:auto; padding:12px 30px; background:#3498db;">📋 Копировать всё</button>
                <button class="generate-btn" onclick="copyAsJSON()" style="width:auto; padding:12px 30px; background:#2ecc71;">📄 Копировать JSON</button>
            </div>

            <!-- ===== ДАННЫЕ ===== -->
            <div id="dataContainer" class="fake-data-grid">
                <!-- Заполняется через JavaScript -->
            </div>

        </div>

        <div class="footer">
            © 2026 Мой студенческий сайт
        </div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // ===== ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ =====
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            if (body.getAttribute('data-theme') === 'light') {
                body.removeAttribute('data-theme');
                icon.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                icon.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            }
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            const icon = document.getElementById('themeIcon');
            if (savedTheme === 'light') {
                document.body.setAttribute('data-theme', 'light');
                icon.textContent = '☀️';
            } else {
                icon.textContent = '🌙';
            }
        }

        // ===== ДАННЫЕ =====
        const maleFirstNames = ['Александр', 'Дмитрий', 'Максим', 'Сергей', 'Андрей', 'Алексей', 'Иван', 'Евгений', 'Михаил', 'Роман', 'Артём', 'Владимир', 'Николай', 'Павел', 'Константин', 'Вадим', 'Вячеслав', 'Станислав', 'Олег', 'Григорий'];
        const femaleFirstNames = ['Анастасия', 'Екатерина', 'Мария', 'Елена', 'Анна', 'Дарья', 'Ольга', 'Татьяна', 'Светлана', 'Ирина', 'Наталья', 'Виктория', 'Юлия', 'Алиса', 'София', 'Алина', 'Полина', 'Вероника', 'Александра', 'Евгения'];
        const lastNames = ['Иванов', 'Петров', 'Сидоров', 'Кузнецов', 'Смирнов', 'Попов', 'Васильев', 'Новиков', 'Морозов', 'Лебедев', 'Козлов', 'Волков', 'Соколов', 'Михайлов', 'Фёдоров', 'Тарасов', 'Белов', 'Комаров', 'Орлов', 'Карпов', 'Макарова', 'Андреева', 'Ковалёва', 'Ильина', 'Гусева', 'Титова', 'Мухина', 'Белова', 'Крылова', 'Соловьёва'];
        const streets = ['Ленина', 'Пушкина', 'Гагарина', 'Советская', 'Молодёжная', 'Кирова', 'Октябрьская', 'Победы', 'Мира', 'Лермонтова', 'Чкалова', 'Калинина', 'Дзержинского', 'Комсомольская', 'Парковая'];
        const cities = ['Москва', 'Санкт-Петербург', 'Новосибирск', 'Екатеринбург', 'Казань', 'Нижний Новгород', 'Челябинск', 'Самара', 'Омск', 'Ростов-на-Дону', 'Уфа', 'Красноярск', 'Пермь', 'Воронеж', 'Волгоград', 'Краснодар', 'Саратов', 'Тюмень', 'Ижевск', 'Барнаул', 'Благовещенск', 'Хабаровск', 'Владивосток'];
        const positions = ['Менеджер', 'Разработчик', 'Аналитик', 'Дизайнер', 'Тестировщик', 'Администратор', 'Специалист', 'Инженер', 'Архитектор', 'Консультант', 'Руководитель', 'Ассистент', 'Координатор'];
        const domains = ['gmail.com', 'mail.ru', 'yandex.ru', 'inbox.ru', 'outlook.com', 'list.ru', 'bk.ru'];
        const carriers = ['МТС', 'Билайн', 'Мегафон', 'Tele2', 'Yota'];

        // ===== КОМПАНИИ (реальные российские) =====
        const companies = [
            'ПАО "Сбербанк"',
            'ПАО "Газпром"',
            'ПАО "Лукойл"',
            'ПАО "Роснефть"',
            'ПАО "Норникель"',
            'ПАО "Сургутнефтегаз"',
            'ПАО "Магнит"',
            'ПАО "МТС"',
            'ПАО "Вымпел-Коммуникации" (Билайн)',
            'ПАО "Мегафон"',
            'ПАО "Ростелеком"',
            'ПАО "Аэрофлот"',
            'ПАО "РЖД"',
            'ПАО "АЛРОСА"',
            'ПАО "Северсталь"',
            'ПАО "НЛМК"',
            'ПАО "ММК"',
            'ПАО "Татнефть"',
            'ПАО "Башнефть"',
            'ПАО "Интер РАО"',
            'ПАО "РусГидро"',
            'ПАО "ФосАгро"',
            'ПАО "Акрон"',
            'ПАО "Уралкалий"',
            'ПАО "Камаз"',
            'ПАО "АвтоВАЗ"',
            'ПАО "ГК "ПИК"',
            'ПАО "Эталон"',
            'ПАО "ЛСР"',
            'ПАО "Мостотрест"',
            'ПАО "ВТБ"',
            'ПАО "Банк "ФК Открытие"',
            'ПАО "Промсвязьбанк"',
            'ПАО "Росбанк"',
            'ПАО "Московский кредитный банк"',
            'АО "Райффайзенбанк"',
            'АО "ЮниКредит Банк"',
            'ООО "Лента"',
            'АО "Дикси"',
            'ООО "Глобус"',
            'ООО "Ашан"',
            'ООО "Перекрёсток"',
            'ООО "Пятёрочка"',
            'ООО "Яндекс"',
            'ООО "Mail.ru Group"',
            'АО "Касперский"',
            'ООО "1С"',
            'АО "Лаборатория Касперского"',
            'ООО "Нетрика"',
            'АО "Первый канал"',
            'АО "НТВ"',
            'ООО "СТС Медиа"',
            'АО "Газпром-Медиа"',
            'ПАО "Транснефть"',
            'АО "Зарубежнефть"',
            'ПАО "ОГК-2"',
            'ПАО "Энел Россия"',
            'АО "Объединённая авиастроительная корпорация"',
            'АО "Объединённая судостроительная корпорация"',
            'ГК "Роскосмос"',
            'ГК "Росатом"',
            'ООО "Самолет"',
            'ООО "Яндекс.Такси"',
            'ООО "Delivery Club"',
            'ООО "СберМаркет"',
            'ООО "Ozon"',
            'ООО "Wildberries"',
            'ООО "AliExpress Россия"',
            'ГК "ПИК"',
            'ООО "СУ-155"',
            'АО "Моспромстрой"'
        ];

        // ===== ОТЧЕСТВА (по полу) =====
        const malePatronymics = ['Александрович', 'Дмитриевич', 'Максимович', 'Сергеевич', 'Андреевич', 'Алексеевич', 'Иванович', 'Евгеньевич', 'Михайлович', 'Романович', 'Артёмович', 'Владимирович', 'Николаевич', 'Павлович', 'Константинович', 'Вадимович', 'Вячеславович', 'Станиславович', 'Олегович', 'Григорьевич'];
        const femalePatronymics = ['Александровна', 'Дмитриевна', 'Максимовна', 'Сергеевна', 'Андреевна', 'Алексеевна', 'Ивановна', 'Евгеньевна', 'Михайловна', 'Романовна', 'Артёмовна', 'Владимировна', 'Николаевна', 'Павловна', 'Константиновна', 'Вадимовна', 'Вячеславовна', 'Станиславовна', 'Олеговна', 'Григорьевна'];

        function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        // ===== ТРАНСЛИТЕРАЦИЯ =====
        function transliterate(name) {
            const map = {
                'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd', 'е': 'e', 'ё': 'e',
                'ж': 'zh', 'з': 'z', 'и': 'i', 'й': 'y', 'к': 'k', 'л': 'l', 'м': 'm',
                'н': 'n', 'о': 'o', 'п': 'p', 'р': 'r', 'с': 's', 'т': 't', 'у': 'u',
                'ф': 'f', 'х': 'h', 'ц': 'ts', 'ч': 'ch', 'ш': 'sh', 'щ': 'sch',
                'ъ': '', 'ы': 'y', 'ь': '', 'э': 'e', 'ю': 'yu', 'я': 'ya'
            };
            return name.toLowerCase().split('').map(c => map[c] || c).join('');
        }

        function randomPhone() {
            const num = randomInt(1000000, 9999999);
            return `+7 (${randomInt(900, 999)}) ${String(num).slice(0, 3)}-${String(num).slice(3, 5)}-${String(num).slice(5, 7)}`;
        }

        function randomEmail(firstName, lastName) {
            const domain = randomItem(domains);
            const first = transliterate(firstName);
            const last = transliterate(lastName);
            const variants = [
                `${first}.${last}@${domain}`,
                `${first}${randomInt(1, 99)}@${domain}`,
                `${first}${last[0]}@${domain}`,
                `${first[0]}${last}@${domain}`
            ];
            return randomItem(variants);
        }

        function randomDate() {
            const year = randomInt(1970, 2005);
            const month = randomInt(1, 12);
            const day = randomInt(1, 28);
            return `${String(day).padStart(2, '0')}.${String(month).padStart(2, '0')}.${year}`;
        }

        function randomPassport() {
            const series = randomInt(1000, 9999);
            const number = randomInt(100000, 999999);
            return `${series} ${number}`;
        }

        function randomBankCard() {
            const bin = randomItem(['4', '5', '6']);
            const number = bin + Array.from({ length: 15 }, () => randomInt(0, 9)).join('');
            const year = randomInt(26, 33);
            const month = String(randomInt(1, 12)).padStart(2, '0');
            return { number, expiry: `${month}/${year}`, cvv: String(randomInt(100, 999)) };
        }

        function randomAddress() {
            const city = randomItem(cities);
            const street = randomItem(streets);
            const house = randomInt(1, 150);
            const apartment = randomInt(1, 200);
            return { city, street, house, apartment, full: `${city}, ул. ${street}, д. ${house}, кв. ${apartment}` };
        }

        function randomINN() {
            return String(randomInt(1000000000, 9999999999)).padStart(10, '0');
        }

        function randomSNILS() {
            return `${String(randomInt(100, 999))}-${String(randomInt(100, 999))}-${String(randomInt(100, 999))} ${String(randomInt(10, 99))}`;
        }

        function randomCarNumber() {
            const region = randomInt(1, 199);
            const letters = 'АВЕКМНОРСТУХ';
            const nums = randomInt(100, 999);
            return `${letters[randomInt(0, 11)]}${nums}${letters[randomInt(0, 11)]}${letters[randomInt(0, 11)]} ${String(region).padStart(2, '0')}`;
        }

        function getPatronymic(firstName, gender) {
            const idx = maleFirstNames.indexOf(firstName);
            if (idx === -1) {
                return gender === 'male' ? randomItem(malePatronymics) : randomItem(femalePatronymics);
            }
            return gender === 'male' ? malePatronymics[idx] : femalePatronymics[idx];
        }

        // ===== ГЕНЕРАЦИЯ =====
        function generateAll() {
            const gender = randomItem(['male', 'female']);
            const firstName = gender === 'male' ? randomItem(maleFirstNames) : randomItem(femaleFirstNames);
            const lastName = randomItem(lastNames);
            const patronymic = getPatronymic(firstName, gender);
            const birthDate = randomDate();
            const phone = randomPhone();
            const email = randomEmail(firstName, lastName);
            const address = randomAddress();
            const passport = randomPassport();
            const card = randomBankCard();
            const inn = randomINN();
            const snils = randomSNILS();
            const carNumber = randomCarNumber();
            const company = randomItem(companies);
            const position = randomItem(positions);
            const fullName = `${lastName} ${firstName} ${patronymic}`;

            const data = {
                '👤 ФИО': fullName,
                '📅 Дата рождения': birthDate,
                '📱 Телефон': phone,
                '📧 Email': email,
                '📍 Адрес': address.full,
                '🏙️ Город': address.city,
                '📜 Паспорт': `серия ${passport.split(' ')[0]} № ${passport.split(' ')[1]}`,
                '💳 Карта банка': `**** **** **** ${card.number.slice(-4)}`,
                '📅 Срок карты': card.expiry,
                '🔢 CVV': card.cvv,
                '🏢 ИНН': inn,
                '🪪 СНИЛС': snils,
                '🚗 Номер авто': carNumber,
                '🏢 Компания': company,
                '💼 Должность': position,
                '🌐 Домен почты': email.split('@')[1],
                '📅 Полных лет': randomInt(18, 65)
            };

            const container = document.getElementById('dataContainer');
            container.innerHTML = Object.entries(data).map(([label, value]) => `
                        <div class="fake-item">
                            <span class="fake-label">${label}</span>
                            <span class="fake-value">${value}</span>
                        </div>
                    `).join('');

            window._lastData = data;
        }

        // ===== КОПИРОВАНИЕ =====
        function copyAll() {
            const data = window._lastData;
            if (!data) { alert('⚠️ Сначала сгенерируйте данные!'); return; }
            const text = Object.entries(data).map(([label, value]) => `${label}: ${value}`).join('\n');
            navigator.clipboard.writeText(text).then(() => alert('✅ Данные скопированы!'));
        }

        function copyAsJSON() {
            const data = window._lastData;
            if (!data) { alert('⚠️ Сначала сгенерируйте данные!'); return; }
            const json = JSON.stringify(data, null, 2);
            navigator.clipboard.writeText(json).then(() => alert('✅ JSON скопирован!'));
        }

        window.onload = function () {
            loadTheme();
            generateAll();
            console.log('🎭 Генератор фейковых данных загружен');
        };
    </script>

    <script src="header.js"></script>

</body>
</html>
