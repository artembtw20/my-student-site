<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чек-лист безопасности</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div class="logo">
            <img src="10837270.png" alt="Логотип">
            <span id="headerName" class="header-name" title="Нажми, чтобы изменить имя">Студент</span>
        </div>
        <div class="nav">
            <a href="index.html"><i data-lucide="home"></i> Главная</a>
            <a href="sitemap.html"><i data-lucide="map"></i> Все разделы</a>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle" title="Переключить тему">
                <i data-lucide="moon" id="themeIcon"></i>
            </button>
        </div>
    </div>

    <div class="container">
        <div class="page-card" style="text-align: left; align-items: stretch;">

            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
                <div>
                    <h1 style="font-size: 28px; color: var(--text-white); display:flex; align-items:center; gap:10px;">
                        <i data-lucide="shield-check"></i> Чек-лист безопасности
                    </h1>
                    <p class="subtitle" style="font-size: 15px;">Проверь, всё ли ты сделал для защиты своих данных</p>
                </div>
                <a href="sitemap.html" class="back-link" style="font-size: 14px;">
                    <i data-lucide="chevron-left" style="width:16px;height:16px;"></i> Назад
                </a>
            </div>

            <div class="divider" style="margin: 0 0 20px 0; width: 60px;"></div>

            <!-- ===== ПРОГРЕСС ===== -->
            <div class="progress-section">
                <div class="progress-stats">
                    <span id="progressText">0 из 0 выполнено</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                </div>
            </div>

            <!-- ===== КАТЕГОРИИ ===== -->
            <div id="checklistContainer"></div>

            <!-- ===== КНОПКИ ===== -->
            <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; justify-content: center;">
                <button class="generate-btn" onclick="resetChecklist()" style="width: auto; padding: 10px 25px; background: #e74c3c; display:inline-flex; align-items:center; gap:6px; font-family:inherit;">
                    <i data-lucide="rotate-ccw" style="width:16px;height:16px;"></i> Сбросить всё
                </button>
                <button class="generate-btn" onclick="exportChecklist()" style="width: auto; padding: 10px 25px; background: #3498db; display:inline-flex; align-items:center; gap:6px; font-family:inherit;">
                    <i data-lucide="download" style="width:16px;height:16px;"></i> Экспорт
                </button>
                <button class="generate-btn" onclick="document.getElementById('importInput').click()" style="width: auto; padding: 10px 25px; background: #2ecc71; display:inline-flex; align-items:center; gap:6px; font-family:inherit;">
                    <i data-lucide="upload" style="width:16px;height:16px;"></i> Импорт
                </button>
                <input type="file" id="importInput" accept=".json" style="display:none" onchange="importChecklist(event)">
            </div>

        </div>

        <div class="footer">
            © 2026 Мой студенческий сайт
        </div>
    </div>

    <script>
        function refreshIcons() {
            if (window.lucide) lucide.createIcons();
        }

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            if (body.getAttribute('data-theme') === 'light') {
                body.removeAttribute('data-theme');
                icon.setAttribute('data-lucide', 'moon');
                localStorage.setItem('theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                icon.setAttribute('data-lucide', 'sun');
                localStorage.setItem('theme', 'light');
            }
            refreshIcons();
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            const icon = document.getElementById('themeIcon');
            if (savedTheme === 'light') {
                document.body.setAttribute('data-theme', 'light');
                icon.setAttribute('data-lucide', 'sun');
            } else {
                icon.setAttribute('data-lucide', 'moon');
            }
            refreshIcons();
        }

        const checklistData = [
            {
                category: 'Пароли',
                categoryIcon: 'key-round',
                items: [
                    { id: 'pass1', text: 'Использую уникальные пароли для каждого сервиса' },
                    { id: 'pass2', text: 'Пароли содержат не менее 12 символов (буквы + цифры + символы)' },
                    { id: 'pass3', text: 'Не использую личную информацию в паролях (дата рождения, имя)' },
                    { id: 'pass4', text: 'Храню пароли в менеджере паролей (не в браузере)' }
                ]
            },
            {
                category: 'Двухфакторная аутентификация',
                categoryIcon: 'shield-check',
                items: [
                    { id: '2fa1', text: 'Включил 2FA на почте (Gmail, Яндекс, Mail.ru)' },
                    { id: '2fa2', text: 'Включил 2FA на соцсетях (Telegram, VK, Instagram)' },
                    { id: '2fa3', text: 'Включил 2FA на банковских приложениях' },
                    { id: '2fa4', text: 'Использую аутентификатор (Google Authenticator, Яндекс Ключ), а не SMS' }
                ]
            },
            {
                category: 'Почта и аккаунты',
                categoryIcon: 'mail',
                items: [
                    { id: 'email1', text: 'Проверил свои email на утечки (Have I Been Pwned)' },
                    { id: 'email2', text: 'Удалил старые/неиспользуемые аккаунты' },
                    { id: 'email3', text: 'Настроил резервный email для восстановления' }
                ]
            },
            {
                category: 'Устройства и приложения',
                categoryIcon: 'smartphone',
                items: [
                    { id: 'dev1', text: 'Включил автоматические обновления на всех устройствах' },
                    { id: 'dev2', text: 'Удалил приложения, которыми не пользуюсь' },
                    { id: 'dev3', text: 'Проверил, какие приложения имеют доступ к моим данным' }
                ]
            },
            {
                category: 'Безопасность в интернете',
                categoryIcon: 'globe',
                items: [
                    { id: 'web1', text: 'Использую VPN в публичных Wi-Fi сетях' },
                    { id: 'web2', text: 'Не перехожу по подозрительным ссылкам из писем и сообщений' },
                    { id: 'web3', text: 'Проверяю адрес сайта перед вводом пароля (фишинг)' },
                    { id: 'web4', text: 'Использую приватный/инкогнито режим для важных действий' }
                ]
            },
            {
                category: 'Резервное копирование',
                categoryIcon: 'database',
                items: [
                    { id: 'backup1', text: 'Делаю резервные копии важных файлов (в облако или на диск)' },
                    { id: 'backup2', text: 'Храню копии паролей и документов в надёжном месте' }
                ]
            }
        ];

        function getProgress() {
            const saved = localStorage.getItem('securityChecklist');
            return saved ? JSON.parse(saved) : {};
        }

        function saveProgress(data) {
            localStorage.setItem('securityChecklist', JSON.stringify(data));
        }

        function renderChecklist() {
            const container = document.getElementById('checklistContainer');
            const progress = getProgress();

            let totalItems = 0;
            let checkedItems = 0;

            container.innerHTML = checklistData.map(category => {
                const itemsHtml = category.items.map(item => {
                    const isChecked = progress[item.id] || false;
                    if (isChecked) checkedItems++;
                    totalItems++;

                    return `
                        <div class="checklist-item ${isChecked ? 'checked' : ''}" onclick="toggleItem('${item.id}')">
                            <span class="checklist-check">
                                <i data-lucide="${isChecked ? 'check-square' : 'square'}" style="width:18px;height:18px;"></i>
                            </span>
                            <span class="checklist-text">${item.text}</span>
                        </div>
                    `;
                }).join('');

                return `
                    <div class="checklist-category">
                        <div class="checklist-category-title">
                            <i data-lucide="${category.categoryIcon}" style="width:16px;height:16px;vertical-align:-3px;"></i>
                            ${category.category}
                        </div>
                        ${itemsHtml}
                    </div>
                `;
            }).join('');

            updateProgress(totalItems, checkedItems);
            refreshIcons();
        }

        function updateProgress(total, checked) {
            const percent = total === 0 ? 0 : Math.round((checked / total) * 100);
            document.getElementById('progressText').textContent = `${checked} из ${total} выполнено`;
            document.getElementById('progressPercent').textContent = `${percent}%`;
            document.getElementById('progressFill').style.width = `${percent}%`;
        }

        function toggleItem(id) {
            const progress = getProgress();
            progress[id] = !progress[id];
            saveProgress(progress);
            renderChecklist();
        }

        function resetChecklist() {
            if (confirm('Сбросить все отметки?')) {
                localStorage.removeItem('securityChecklist');
                renderChecklist();
            }
        }

        function exportChecklist() {
            const data = getProgress();
            if (Object.keys(data).length === 0) {
                alert('Нет данных для экспорта');
                return;
            }
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `checklist-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importChecklist(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    saveProgress(data);
                    renderChecklist();
                    alert('Чек-лист восстановлен!');
                } catch {
                    alert('Ошибка: неверный формат файла');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        window.onload = function() {
            loadTheme();
            renderChecklist();
            refreshIcons();
            console.log('Чек-лист безопасности загружен');
        };
    </script>

    <script src="header.js"></script>

</body>
</html>
