<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка пароля</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== ШАПКА ===== -->
    <div class="header">
        <div class="logo">
            <img src="10837270.png" alt="Логотип">
            <span id="headerName">Беккер Артём</span>
        </div>
        <div class="nav">
            <a href="index.html">🏠 Главная</a>
            <a href="sitemap.html">🗺️ Все разделы</a>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle" title="Переключить тему">
                <span id="themeIcon">🌙</span>
            </button>
        </div>
    </div>

    <!-- ===== КОНТЕЙНЕР ===== -->
    <div class="container">
        <div class="page-card" style="text-align: left; align-items: stretch;">

            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
                <div>
                    <h1 style="font-size: 28px; color: var(--text-white);">🔐 Проверка пароля</h1>
                    <p class="subtitle" style="font-size: 15px;">Узнай, насколько твой пароль надёжен и был ли он в утечках</p>
                </div>
                <a href="sitemap.html" class="back-link" style="font-size: 14px;">← Назад</a>
            </div>

            <div class="divider" style="margin: 0 0 20px 0; width: 60px;"></div>

            <!-- ===== ВВОД ПАРОЛЯ ===== -->
            <div class="password-checker-input">
                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 200px;">
                        <label style="color: var(--text-gray); font-size: 14px; display: block; margin-bottom: 4px;">🔑 Введите пароль</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="password" id="passwordInput" placeholder="Введите пароль..." style="flex:1; padding:14px 20px; border-radius:var(--radius-small); border:2px solid var(--border-color); background:var(--bg-input); color:var(--text-white); font-size:16px;">
                            <button class="generate-btn" onclick="togglePasswordVisibility()" style="width:auto; padding:14px 20px; background:#666;">👁️</button>
                            <button class="generate-btn" onclick="checkPassword()" style="width:auto; padding:14px 35px;">🔍 Проверить</button>
                        </div>
                    </div>
                </div>
                <div id="statusMessage" style="margin-top:12px; font-size:14px; color:var(--text-gray);"></div>
            </div>

            <!-- ===== РЕЗУЛЬТАТЫ ===== -->
            <div id="resultArea" style="display: none; margin-top: 20px;">

                <!-- Общая оценка -->
                <div id="overallScore" style="padding: 16px 20px; border-radius: var(--radius-medium); text-align: center; font-size: 20px; font-weight: 600; margin-bottom: 20px;">
                </div>

                <!-- Детали -->
                <div class="password-checker-grid">
                    <div class="password-checker-card">
                        <div class="password-checker-card-header">📏 Длина</div>
                        <div class="password-checker-card-body" id="lengthStatus">⏳...</div>
                    </div>
                    <div class="password-checker-card">
                        <div class="password-checker-card-header">🔤 Символы</div>
                        <div class="password-checker-card-body" id="charsetStatus">⏳...</div>
                    </div>
                    <div class="password-checker-card">
                        <div class="password-checker-card-header">🔄 Уникальность</div>
                        <div class="password-checker-card-body" id="uniquenessStatus">⏳...</div>
                    </div>
                    <div class="password-checker-card">
                        <div class="password-checker-card-header">🌐 Утечки (Pwned)</div>
                        <div class="password-checker-card-body" id="pwnedStatus">⏳ Проверка...</div>
                    </div>
                </div>

                <!-- Советы -->
                <div id="tipsArea" style="margin-top: 16px; padding: 16px 20px; background: var(--bg-input); border-radius: var(--radius-medium);">
                    <h3 style="color: var(--text-white); margin-bottom: 8px;">💡 Советы</h3>
                    <div id="tipsList"></div>
                </div>
            </div>

            <!-- ===== ИСТОРИЯ ===== -->
            <div class="history-area" style="margin-top: 25px;">
                <div class="history-header">
                    <span>📋 История проверок</span>
                    <button class="clear-history-btn" onclick="clearPasswordHistory()">🗑️ Очистить</button>
                </div>
                <div id="passwordHistoryList" class="history-list">
                    <span style="color: var(--text-gray); font-size: 14px;">История пуста</span>
                </div>
            </div>

        </div>

        <div class="footer">
            © 2026 Мой студенческий сайт
        </div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        let currentPassword = '';

        // ===== ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ =====
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            if (body.getAttribute('data-theme') === 'light') {
                body.removeAttribute('data-theme');
                icon.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                icon.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            }
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            const icon = document.getElementById('themeIcon');
            if (savedTheme === 'light') {
                document.body.setAttribute('data-theme', 'light');
                icon.textContent = '☀️';
            } else {
                icon.textContent = '🌙';
            }
        }

        // ===== ПОКАЗАТЬ/СКРЫТЬ ПАРОЛЬ =====
        function togglePasswordVisibility() {
            const input = document.getElementById('passwordInput');
            const btn = event.target;
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // ===== ОСНОВНАЯ ПРОВЕРКА =====
        async function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const statusEl = document.getElementById('statusMessage');
            const resultArea = document.getElementById('resultArea');

            if (!password || password.length < 1) {
                statusEl.textContent = '⚠️ Введите пароль';
                statusEl.style.color = '#f39c12';
                return;
            }

            currentPassword = password;
            statusEl.textContent = '⏳ Проверка...';
            statusEl.style.color = 'var(--text-gray)';
            resultArea.style.display = 'block';

            // 1. Оценка сложности
            const complexity = evaluatePassword(password);

            // 2. Проверка в утечках (Pwned Passwords)
            const pwnedResult = await checkPwned(password);

            // 3. Отображение результатов
            displayResults(complexity, pwnedResult);

            // 4. История
            addToPasswordHistory(password, complexity.score, pwnedResult);

            statusEl.textContent = '✅ Проверка завершена';
            statusEl.style.color = '#27ae60';
        }

        // ===== ОЦЕНКА СЛОЖНОСТИ =====
        function evaluatePassword(password) {
            const length = password.length;
            const hasLower = /[a-z]/.test(password);
            const hasUpper = /[A-Z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const hasSymbol = /[^a-zA-Z0-9]/.test(password);

            let charsetSize = 0;
            if (hasLower) charsetSize += 26;
            if (hasUpper) charsetSize += 26;
            if (hasNumber) charsetSize += 10;
            if (hasSymbol) charsetSize += 32;

            const entropy = Math.log2(Math.pow(charsetSize, length));
            let score = 0;
            let scoreText = '';
            let scoreColor = '';

            if (length >= 12) score += 30;
            else if (length >= 8) score += 15;
            else score += 5;

            if (hasLower && hasUpper) score += 15;
            else if (hasLower || hasUpper) score += 5;

            if (hasNumber) score += 10;
            if (hasSymbol) score += 15;

            // Проверка на словарные слова
            const commonWords = ['password', 'qwerty', '123456', 'admin', 'letmein', 'welcome', 'monkey', 'dragon', 'master', 'hello', 'fuckyou', 'trustno1'];
            const lowerPass = password.toLowerCase();
            if (commonWords.some(word => lowerPass.includes(word))) score -= 10;

            // Проверка на повторяющиеся символы
            if (/(.)\1{2,}/.test(password)) score -= 10;

            // Нормализация
            score = Math.max(0, Math.min(100, score));

            if (score >= 80) {
                scoreText = '🔒 Отличный пароль';
                scoreColor = '#27ae60';
            } else if (score >= 60) {
                scoreText = '⚠️ Хороший пароль';
                scoreColor = '#f39c12';
            } else if (score >= 40) {
                scoreText = '⚠️ Средний пароль';
                scoreColor = '#e67e22';
            } else {
                scoreText = '❌ Слабый пароль';
                scoreColor = '#e74c3c';
            }

            return {
                length,
                hasLower,
                hasUpper,
                hasNumber,
                hasSymbol,
                charsetSize,
                entropy,
                score,
                scoreText,
                scoreColor
            };
        }

        // ===== ПРОВЕРКА В PWND PASSWORDS =====
        async function checkPwned(password) {
            try {
                const encoder = new TextEncoder();
                const data = encoder.encode(password);
                const hashBuffer = await crypto.subtle.digest('SHA-1', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
                const prefix = hashHex.substring(0, 5);
                const suffix = hashHex.substring(5);

                const response = await fetch(`https://api.pwnedpasswords.com/range/${prefix}`);
                if (!response.ok) {
                    return { found: false, count: 0, error: 'Ошибка API' };
                }

                const text = await response.text();
                const lines = text.split('\n');
                let count = 0;
                for (const line of lines) {
                    if (line.startsWith(suffix)) {
                        count = parseInt(line.split(':')[1]) || 0;
                        break;
                    }
                }

                return { found: count > 0, count };
            } catch (error) {
                console.error('Ошибка проверки Pwned:', error);
                return { found: false, count: 0, error: error.message };
            }
        }

        // ===== ОТОБРАЖЕНИЕ РЕЗУЛЬТАТОВ =====
        function displayResults(complexity, pwned) {
            const scoreEl = document.getElementById('overallScore');
            scoreEl.textContent = `${complexity.scoreText} (${Math.round(complexity.score)}%)`;
            scoreEl.style.background = `${complexity.scoreColor}22`;
            scoreEl.style.color = complexity.scoreColor;

            // Длина
            document.getElementById('lengthStatus').textContent = complexity.length + ' символов';
            document.getElementById('lengthStatus').style.color = complexity.length >= 12 ? '#27ae60' : '#e74c3c';

            // Символы
            const hasAll = complexity.hasLower && complexity.hasUpper && complexity.hasNumber && complexity.hasSymbol;
            document.getElementById('charsetStatus').textContent = hasAll ? '✅ Буквы + цифры + символы' : '⚠️ Добавьте разнообразные символы';
            document.getElementById('charsetStatus').style.color = hasAll ? '#27ae60' : '#f39c12';

            // Уникальность
            const isUnique = complexity.entropy > 60;
            document.getElementById('uniquenessStatus').textContent = isUnique ? `✅ Уникальный (${Math.round(complexity.entropy)} бит)` : '⚠️ Слишком предсказуемый';
            document.getElementById('uniquenessStatus').style.color = isUnique ? '#27ae60' : '#f39c12';

            // Утечки
            const pwnedEl = document.getElementById('pwnedStatus');
            if (pwned.error) {
                pwnedEl.textContent = '⚠️ ' + pwned.error;
                pwnedEl.style.color = '#f39c12';
            } else if (pwned.found) {
                pwnedEl.textContent = `❌ Найден в ${pwned.count} утечках!`;
                pwnedEl.style.color = '#e74c3c';
            } else {
                pwnedEl.textContent = '✅ Не найден в утечках';
                pwnedEl.style.color = '#27ae60';
            }

            // Советы
            const tips = document.getElementById('tipsList');
            const tipsArray = [];

            if (complexity.length < 12) tipsArray.push('🔑 Используйте минимум 12 символов');
            if (!complexity.hasLower || !complexity.hasUpper) tipsArray.push('🔤 Добавьте заглавные и строчные буквы');
            if (!complexity.hasNumber) tipsArray.push('🔢 Добавьте цифры');
            if (!complexity.hasSymbol) tipsArray.push('🔣 Добавьте спецсимволы (!@#$%^&*)');
            if (pwned.found) tipsArray.push('🛑 Этот пароль был в утечках! Смените его');
            if (complexity.entropy < 60) tipsArray.push('🧠 Используйте длинную фразу вместо одного слова');

            if (tipsArray.length === 0) {
                tips.innerHTML = '<div style="color: #27ae60;">✅ Отличный пароль! Все критерии соблюдены.</div>';
            } else {
                tips.innerHTML = tipsArray.map(t => `<div style="color: var(--text-light); padding: 4px 0;">• ${t}</div>`).join('');
            }
        }

        // ===== ИСТОРИЯ =====
        function addToPasswordHistory(password, score, pwned) {
            let history = JSON.parse(localStorage.getItem('passwordHistory')) || [];
            const now = new Date();
            const timeStr = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            const status = pwned.found ? '❌ В утечке' : '✅ Безопасен';

            history.unshift({
                password: password.substring(0, 10) + '...',
                score: Math.round(score),
                status: status,
                date: timeStr
            });

            if (history.length > 50) history.pop();
            localStorage.setItem('passwordHistory', JSON.stringify(history));
            renderPasswordHistory();
        }

        function renderPasswordHistory() {
            const history = JSON.parse(localStorage.getItem('passwordHistory')) || [];
            const list = document.getElementById('passwordHistoryList');

            if (history.length === 0) {
                list.innerHTML = '<span style="color: var(--text-gray); font-size: 14px;">История пуста</span>';
                return;
            }

            list.innerHTML = history.map((item, index) => `
                        <div class="history-item">
                            <span style="color: var(--text-light); font-size:13px;">${item.password}</span>
                            <span style="color: ${item.score >= 70 ? '#27ae60' : '#e74c3c'};">${item.score}%</span>
                            <span style="font-size:12px; color:${item.status.includes('✅') ? '#27ae60' : '#e74c3c'};">${item.status}</span>
                            <span style="font-size:11px; color:var(--text-gray);">${item.date}</span>
                            <button class="history-delete" onclick="removePasswordHistoryItem(${index})">✕</button>
                        </div>
                    `).join('');
        }

        function removePasswordHistoryItem(index) {
            let history = JSON.parse(localStorage.getItem('passwordHistory')) || [];
            history.splice(index, 1);
            localStorage.setItem('passwordHistory', JSON.stringify(history));
            renderPasswordHistory();
        }

        function clearPasswordHistory() {
            if (confirm('🗑️ Удалить всю историю?')) {
                localStorage.removeItem('passwordHistory');
                renderPasswordHistory();
            }
        }

        // ===== ENTER =====
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('passwordInput').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    checkPassword();
                }
            });
        });

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        window.onload = function () {
            loadTheme();
            renderPasswordHistory();
            console.log('🔐 Проверка пароля загружена');
        };
    </script>

    <script src="header.js"></script>

</body>
</html>
