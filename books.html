<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои книги</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div class="logo">
            <img src="10837270.png" alt="Логотип">
            <span id="headerName" class="header-name" title="Нажми, чтобы изменить имя">Студент</span>
        </div>
        <div class="nav">
            <a href="index.html"><i data-lucide="home"></i> Главная</a>
        </div>
    </div>

    <div class="container">
        <div class="page-card">
            <div class="icon"><i data-lucide="book-open" style="width:64px;height:64px;"></i></div>
            <h1>Мои книги</h1>
            <p class="subtitle">Что читаю и что уже прочитал</p>
            <div class="divider"></div>
            <div class="coming-soon">
                <i data-lucide="clock" style="width:14px;height:14px;vertical-align:-2px;"></i>
                Скоро здесь будет список книг
            </div>
        </div>

        <div class="footer">
            © 2026 Мой студенческий сайт
        </div>
    </div>

    <script>
        function refreshIcons() {
            if (window.lucide) lucide.createIcons();
        }

        window.onload = function () {
            refreshIcons();
        };
    </script>

    <script src="header.js"></script>

</body>
</html>
