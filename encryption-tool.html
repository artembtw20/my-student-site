<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шифрование и дешифрование</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== ШАПКА ===== -->
    <div class="header">
        <div class="logo">
            <img src="10837270.png" alt="Логотип">
            <span id="headerName">Беккер Артём</span>
        </div>
        <div class="nav">
            <a href="index.html">🏠 Главная</a>
            <a href="sitemap.html">🗺️ Все разделы</a>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle" title="Переключить тему">
                <span id="themeIcon">🌙</span>
            </button>
        </div>
    </div>

    <!-- ===== КОНТЕЙНЕР ===== -->
    <div class="container">
        <div class="page-card" style="text-align: left; align-items: stretch;">

            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
                <div>
                    <h1 style="font-size: 28px; color: var(--text-white);">🧪 Шифрование и дешифрование</h1>
                    <p class="subtitle" style="font-size: 15px;">Зашифруй и расшифруй текст разными алгоритмами</p>
                </div>
                <a href="sitemap.html" class="back-link" style="font-size: 14px;">← Назад</a>
            </div>

            <div class="divider" style="margin: 0 0 20px 0; width: 60px;"></div>

            <!-- ===== НАСТРОЙКИ ===== -->
            <div class="encryption-settings">
                <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px;">
                    <div style="flex: 1; min-width: 150px;">
                        <label style="color: var(--text-gray); font-size: 14px; display: block; margin-bottom: 4px;">Алгоритм</label>
                        <select id="algorithmSelect" style="width:100%; padding:10px 14px; border-radius:var(--radius-small); border:1px solid var(--border-color); background:var(--bg-input); color:var(--text-white); font-size:15px;">
                            <option value="caesar">🔤 Caesar (сдвиг)</option>
                            <option value="base64">📦 Base64</option>
                            <option value="aes">🔐 AES (симметричное)</option>
                        </select>
                    </div>
                    <div style="flex: 1; min-width: 150px;" id="keyContainer">
                        <label style="color: var(--text-gray); font-size: 14px; display: block; margin-bottom: 4px;">Ключ / Сдвиг</label>
                        <input type="text" id="keyInput" value="3" placeholder="Число для сдвига" style="width:100%; padding:10px 14px; border-radius:var(--radius-small); border:1px solid var(--border-color); background:var(--bg-input); color:var(--text-white); font-size:15px;">
                    </div>
                </div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="generate-btn" onclick="encrypt()" style="width:auto; padding:10px 25px;">🔒 Зашифровать</button>
                    <button class="generate-btn" onclick="decrypt()" style="width:auto; padding:10px 25px; background:#3498db;">🔓 Расшифровать</button>
                    <button class="generate-btn" onclick="clearAll()" style="width:auto; padding:10px 25px; background:#666;">🔄 Очистить</button>
                </div>
            </div>

            <!-- ===== ТЕКСТ ===== -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
                <div>
                    <label style="color: var(--text-gray); font-size: 14px; display: block; margin-bottom: 4px;">📝 Исходный текст</label>
                    <textarea id="inputText" rows="6" style="width:100%; padding:12px 16px; border-radius:var(--radius-small); border:1px solid var(--border-color); background:var(--bg-input); color:var(--text-white); font-size:15px; resize:vertical; font-family:inherit;">Привет, мир! Это тестовое сообщение для шифрования.</textarea>
                </div>
                <div>
                    <label style="color: var(--text-gray); font-size: 14px; display: block; margin-bottom: 4px;">🔐 Результат</label>
                    <textarea id="outputText" rows="6" style="width:100%; padding:12px 16px; border-radius:var(--radius-small); border:1px solid var(--border-color); background:var(--bg-input); color:var(--text-white); font-size:15px; resize:vertical; font-family:inherit;" readonly></textarea>
                </div>
            </div>

            <!-- ===== ИНФОРМАЦИЯ ===== -->
            <div id="infoArea" style="margin-top: 16px; padding: 12px 16px; background: var(--bg-input); border-radius: var(--radius-small); color: var(--text-gray); font-size: 14px; display: none;">
            </div>

            <!-- ===== ИСТОРИЯ ===== -->
            <div class="history-area" style="margin-top: 20px;">
                <div class="history-header">
                    <span>📋 История операций</span>
                    <button class="clear-history-btn" onclick="clearEncryptHistory()">🗑️ Очистить</button>
                </div>
                <div id="encryptHistoryList" class="history-list">
                    <span style="color: var(--text-gray); font-size: 14px;">История пуста</span>
                </div>
            </div>

        </div>

        <div class="footer">
            © 2026 Мой студенческий сайт
        </div>
    </div>

    <script>
        // ===== ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ =====
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            if (body.getAttribute('data-theme') === 'light') {
                body.removeAttribute('data-theme');
                icon.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                icon.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            }
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            const icon = document.getElementById('themeIcon');
            if (savedTheme === 'light') {
                document.body.setAttribute('data-theme', 'light');
                icon.textContent = '☀️';
            } else {
                icon.textContent = '🌙';
            }
        }

        // ===== ИЗМЕНЕНИЕ АЛГОРИТМА =====
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('algorithmSelect').addEventListener('change', function () {
                const keyLabel = document.getElementById('keyContainer').querySelector('label');
                const keyInput = document.getElementById('keyInput');
                if (this.value === 'caesar') {
                    keyLabel.textContent = '🔢 Сдвиг (число)';
                    keyInput.placeholder = 'Число от 1 до 25';
                    keyInput.value = '3';
                    keyInput.disabled = false;
                } else if (this.value === 'base64') {
                    keyLabel.textContent = '🔑 Ключ (не используется)';
                    keyInput.placeholder = 'Base64 не требует ключа';
                    keyInput.value = '—';
                    keyInput.disabled = true;
                } else if (this.value === 'aes') {
                    keyLabel.textContent = '🔑 Ключ (пароль)';
                    keyInput.placeholder = 'Введите пароль для AES';
                    keyInput.value = 'mysecretpassword';
                    keyInput.disabled = false;
                }
            });
        });

        // ===== ШИФРОВАНИЕ =====
        async function encrypt() {
            const text = document.getElementById('inputText').value;
            const algorithm = document.getElementById('algorithmSelect').value;
            const key = document.getElementById('keyInput').value;
            const output = document.getElementById('outputText');
            const info = document.getElementById('infoArea');

            if (!text) {
                alert('⚠️ Введите текст для шифрования');
                return;
            }

            let result = '';
            let infoText = '';

            try {
                switch (algorithm) {
                    case 'caesar':
                        const shift = parseInt(key);
                        if (isNaN(shift) || shift < 1 || shift > 25) {
                            alert('⚠️ Введите число от 1 до 25');
                            return;
                        }
                        result = caesarEncrypt(text, shift);
                        infoText = `✅ Зашифровано Caesar сдвигом ${shift}`;
                        break;

                    case 'base64':
                        result = btoa(unescape(encodeURIComponent(text)));
                        infoText = '✅ Зашифровано Base64';
                        break;

                    case 'aes':
                        if (!key || key.length < 4) {
                            alert('⚠️ Введите ключ (минимум 4 символа)');
                            return;
                        }
                        result = await aesEncrypt(text, key);
                        infoText = `✅ Зашифровано AES с ключом: ${key}`;
                        break;

                    default:
                        alert('⚠️ Выберите алгоритм');
                        return;
                }

                output.value = result;
                info.style.display = 'block';
                info.innerHTML = infoText;
                info.style.color = '#27ae60';

                addToEncryptHistory('🔒 Шифрование', algorithm, text.substring(0, 30) + '...', result.substring(0, 30) + '...');

            } catch (error) {
                alert('❌ Ошибка шифрования: ' + error.message);
                console.error(error);
            }
        }

        // ===== ДЕШИФРОВАНИЕ =====
        async function decrypt() {
            const text = document.getElementById('outputText').value;
            const algorithm = document.getElementById('algorithmSelect').value;
            const key = document.getElementById('keyInput').value;
            const output = document.getElementById('outputText');
            const info = document.getElementById('infoArea');

            if (!text) {
                alert('⚠️ Введите текст для дешифрования');
                return;
            }

            let result = '';
            let infoText = '';

            try {
                switch (algorithm) {
                    case 'caesar':
                        const shift = parseInt(key);
                        if (isNaN(shift) || shift < 1 || shift > 25) {
                            alert('⚠️ Введите число от 1 до 25');
                            return;
                        }
                        result = caesarDecrypt(text, shift);
                        infoText = `✅ Расшифровано Caesar сдвигом ${shift}`;
                        break;

                    case 'base64':
                        result = decodeURIComponent(escape(atob(text)));
                        infoText = '✅ Расшифровано Base64';
                        break;

                    case 'aes':
                        if (!key || key.length < 4) {
                            alert('⚠️ Введите ключ (минимум 4 символа)');
                            return;
                        }
                        result = await aesDecrypt(text, key);
                        infoText = `✅ Расшифровано AES с ключом: ${key}`;
                        break;

                    default:
                        alert('⚠️ Выберите алгоритм');
                        return;
                }

                output.value = result;
                info.style.display = 'block';
                info.innerHTML = infoText;
                info.style.color = '#27ae60';

                addToEncryptHistory('🔓 Дешифрование', algorithm, text.substring(0, 30) + '...', result.substring(0, 30) + '...');

            } catch (error) {
                alert('❌ Ошибка дешифрования: ' + error.message);
                console.error(error);
            }
        }

        // ===== АЛГОРИТМЫ =====

        // --- Caesar ---
        function caesarEncrypt(text, shift) {
            return text.split('').map(char => {
                const code = char.charCodeAt(0);
                if (code >= 65 && code <= 90) {
                    return String.fromCharCode(((code - 65 + shift) % 26) + 65);
                } else if (code >= 97 && code <= 122) {
                    return String.fromCharCode(((code - 97 + shift) % 26) + 97);
                } else if (code >= 1040 && code <= 1071) {
                    return String.fromCharCode(((code - 1040 + shift) % 32) + 1040);
                } else if (code >= 1072 && code <= 1103) {
                    return String.fromCharCode(((code - 1072 + shift) % 32) + 1072);
                }
                return char;
            }).join('');
        }

        function caesarDecrypt(text, shift) {
            return caesarEncrypt(text, 26 - shift);
        }

        // --- AES ---
        async function aesEncrypt(text, password) {
            const encoder = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                encoder.encode(password),
                'PBKDF2',
                false,
                ['deriveKey']
            );
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt']
            );
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encrypted = await crypto.subtle.encrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                encoder.encode(text)
            );
            const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
            combined.set(salt, 0);
            combined.set(iv, salt.length);
            combined.set(new Uint8Array(encrypted), salt.length + iv.length);
            return btoa(String.fromCharCode(...combined));
        }

        async function aesDecrypt(encryptedBase64, password) {
            const combined = Uint8Array.from(atob(encryptedBase64), c => c.charCodeAt(0));
            const salt = combined.slice(0, 16);
            const iv = combined.slice(16, 28);
            const encrypted = combined.slice(28);
            const encoder = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                encoder.encode(password),
                'PBKDF2',
                false,
                ['deriveKey']
            );
            const key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
                keyMaterial,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );
            const decrypted = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: iv },
                key,
                encrypted
            );
            return new TextDecoder().decode(decrypted);
        }

        // ===== ОЧИСТКА =====
        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
            document.getElementById('infoArea').style.display = 'none';
        }

        // ===== ИСТОРИЯ =====
        function addToEncryptHistory(action, algorithm, original, result) {
            let history = JSON.parse(localStorage.getItem('encryptHistory')) || [];
            const now = new Date();
            const timeStr = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

            history.unshift({
                action: action,
                algorithm: algorithm,
                original: original,
                result: result,
                date: timeStr
            });

            if (history.length > 50) history.pop();
            localStorage.setItem('encryptHistory', JSON.stringify(history));
            renderEncryptHistory();
        }

        function renderEncryptHistory() {
            const history = JSON.parse(localStorage.getItem('encryptHistory')) || [];
            const list = document.getElementById('encryptHistoryList');

            if (history.length === 0) {
                list.innerHTML = '<span style="color: var(--text-gray); font-size: 14px;">История пуста</span>';
                return;
            }

            list.innerHTML = history.map((item, index) => `
                    <div class="history-item">
                        <span style="color: var(--text-light); font-size:13px;">${item.action}</span>
                        <span style="color: var(--text-gray); font-size:12px;">${item.algorithm}</span>
                        <span style="color: var(--text-gray); font-size:12px;">${item.date}</span>
                        <button class="history-delete" onclick="removeEncryptHistoryItem(${index})">✕</button>
                    </div>
                `).join('');
        }

        function removeEncryptHistoryItem(index) {
            let history = JSON.parse(localStorage.getItem('encryptHistory')) || [];
            history.splice(index, 1);
            localStorage.setItem('encryptHistory', JSON.stringify(history));
            renderEncryptHistory();
        }

        function clearEncryptHistory() {
            if (confirm('🗑️ Удалить всю историю?')) {
                localStorage.removeItem('encryptHistory');
                renderEncryptHistory();
            }
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        window.onload = function () {
            loadTheme();
            renderEncryptHistory();
            console.log('🧪 Шифрование и дешифрование загружено');
        };
    </script>

    <script src="header.js"></script>

</body>
</html>
