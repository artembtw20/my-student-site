<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор паролей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== ШАПКА ===== -->
    <div class="header">
        <div class="logo">
            <img src="10837270.png" alt="Логотип">
            <span id="headerName">Беккер Артём</span>
        </div>
        <div class="nav">
            <a href="index.html">🏠 Главная</a>
            <a href="sitemap.html">🗺️ Все разделы</a>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle" title="Переключить тему">
                <span id="themeIcon">🌙</span>
            </button>
        </div>
    </div>

    <!-- ===== КОНТЕЙНЕР ===== -->
    <div class="container">
        <div class="page-card" style="text-align: left; align-items: stretch;">

            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
                <div>
                    <h1 style="font-size: 28px; color: var(--text-white);">🔐 Генератор паролей</h1>
                    <p class="subtitle" style="font-size: 15px;">Создай надёжный пароль и проверь его стойкость</p>
                </div>
                <a href="sitemap.html" class="back-link" style="font-size: 14px;">← Назад</a>
            </div>

            <div class="divider" style="margin: 0 0 25px 0; width: 60px;"></div>

            <!-- ===== НАСТРОЙКИ ===== -->
            <div class="generator-settings">
                <div class="setting-group">
                    <label>Длина пароля: <span id="lengthDisplay">12</span></label>
                    <input type="range" id="lengthSlider" min="4" max="64" value="12" oninput="updateLength(this.value)">
                </div>

                <div class="setting-group">
                    <label><input type="checkbox" id="includeUppercase" checked> A-Z (заглавные)</label>
                    <label><input type="checkbox" id="includeLowercase" checked> a-z (строчные)</label>
                    <label><input type="checkbox" id="includeNumbers" checked> 0-9 (цифры)</label>
                    <label><input type="checkbox" id="includeSymbols" checked> !@#$%^&* (символы)</label>
                </div>

                <button class="generate-btn" onclick="generatePassword()">🔀 Сгенерировать пароль</button>
            </div>

            <!-- ===== РЕЗУЛЬТАТ ===== -->
            <div class="result-area" id="resultArea">
                <div class="password-display">
                    <span id="generatedPassword">Нажмите «Сгенерировать»</span>
                    <button class="copy-btn" onclick="copyPassword()" id="copyBtn" style="display: none;">📋</button>
                </div>

                <div class="strength-meter">
                    <div class="strength-bar" id="strengthBar" style="width: 0%;"></div>
                </div>
                <div class="strength-text" id="strengthText">Стойкость: —</div>

                <div class="strength-details" id="strengthDetails">
                    <span>⏱️ Время взлома: <strong id="crackTime">—</strong></span>
                    <span>🔢 Энтропия: <strong id="entropy">—</strong> бит</span>
                </div>
            </div>

            <!-- ===== ИСТОРИЯ ===== -->
            <div class="history-area">
                <div class="history-header">
                    <span>📋 История паролей</span>
                    <button class="clear-history-btn" onclick="clearHistory()">🗑️ Очистить</button>
                </div>
                <div id="historyList" class="history-list">
                    <span style="color: var(--text-gray); font-size: 14px;">История пуста</span>
                </div>
            </div>

        </div>

        <div class="footer">
            © 2026 Мой студенческий сайт
        </div>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // ===== ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ =====
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            if (body.getAttribute('data-theme') === 'light') {
                body.removeAttribute('data-theme');
                icon.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                icon.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            }
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            const icon = document.getElementById('themeIcon');
            if (savedTheme === 'light') {
                document.body.setAttribute('data-theme', 'light');
                icon.textContent = '☀️';
            } else {
                icon.textContent = '🌙';
            }
        }

        // ===== ОБНОВЛЕНИЕ ДЛИНЫ =====
        function updateLength(val) {
            document.getElementById('lengthDisplay').textContent = val;
        }

        // ===== ГЕНЕРАЦИЯ ПАРОЛЯ =====
        function generatePassword() {
            const length = parseInt(document.getElementById('lengthSlider').value);
            const includeUppercase = document.getElementById('includeUppercase').checked;
            const includeLowercase = document.getElementById('includeLowercase').checked;
            const includeNumbers = document.getElementById('includeNumbers').checked;
            const includeSymbols = document.getElementById('includeSymbols').checked;

            const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const lowercase = 'abcdefghijklmnopqrstuvwxyz';
            const numbers = '0123456789';
            const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';

            let charset = '';
            if (includeUppercase) charset += uppercase;
            if (includeLowercase) charset += lowercase;
            if (includeNumbers) charset += numbers;
            if (includeSymbols) charset += symbols;

            if (charset === '') {
                alert('⚠️ Выберите хотя бы один набор символов!');
                return;
            }

            let password = '';
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * charset.length);
                password += charset[randomIndex];
            }

            document.getElementById('generatedPassword').textContent = password;
            document.getElementById('copyBtn').style.display = 'inline-block';
            calculateStrength(password);
            addToHistory(password);
        }

        // ===== РАСЧЁТ СТОЙКОСТИ =====
        function calculateStrength(password) {
            const length = password.length;
            let charsetSize = 0;
            const hasLower = /[a-z]/.test(password);
            const hasUpper = /[A-Z]/.test(password);
            const hasNumber = /[0-9]/.test(password);
            const hasSymbol = /[^a-zA-Z0-9]/.test(password);

            if (hasLower) charsetSize += 26;
            if (hasUpper) charsetSize += 26;
            if (hasNumber) charsetSize += 10;
            if (hasSymbol) charsetSize += 32;

            const entropy = Math.log2(Math.pow(charsetSize, length));
            const seconds = Math.pow(2, entropy) / 1e9; // 1 млрд паролей в секунду

            let strength = 'Критически слабый';
            let color = '#e74c3c';
            let width = 10;

            if (entropy > 100) {
                strength = 'Очень сильный 💪';
                color = '#27ae60';
                width = 100;
            } else if (entropy > 80) {
                strength = 'Сильный ✅';
                color = '#2ecc71';
                width = 75;
            } else if (entropy > 50) {
                strength = 'Средний ⚠️';
                color = '#f39c12';
                width = 50;
            } else if (entropy > 30) {
                strength = 'Слабый ❌';
                color = '#e67e22';
                width = 25;
            }

            document.getElementById('strengthBar').style.width = width + '%';
            document.getElementById('strengthBar').style.background = color;
            document.getElementById('strengthText').textContent = `Стойкость: ${strength}`;
            document.getElementById('strengthText').style.color = color;

            let crackTime = 'Мгновенно';
            if (seconds > 1e12) crackTime = 'Миллиарды лет';
            else if (seconds > 1e9) crackTime = 'Сотни лет';
            else if (seconds > 1e6) crackTime = 'Годы';
            else if (seconds > 1e3) crackTime = 'Несколько часов';
            else if (seconds > 60) crackTime = 'Несколько минут';
            else if (seconds > 1) crackTime = 'Секунды';

            document.getElementById('crackTime').textContent = crackTime;
            document.getElementById('entropy').textContent = Math.round(entropy);
        }

        // ===== КОПИРОВАНИЕ =====
        function copyPassword() {
            const password = document.getElementById('generatedPassword').textContent;
            navigator.clipboard.writeText(password).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = '✅';
                setTimeout(() => { btn.textContent = '📋'; }, 1500);
            });
        }

        // ===== ИСТОРИЯ =====
        function addToHistory(password) {
            let history = JSON.parse(localStorage.getItem('passwordHistory')) || [];
            const now = new Date();
            const timeStr = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            history.unshift({ password, date: timeStr });
            if (history.length > 50) history.pop();
            localStorage.setItem('passwordHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('passwordHistory')) || [];
            const list = document.getElementById('historyList');
            if (history.length === 0) {
                list.innerHTML = '<span style="color: var(--text-gray); font-size: 14px;">История пуста</span>';
                return;
            }
            list.innerHTML = history.map((item, index) => `
                    <div class="history-item">
                        <span class="history-password">${item.password}</span>
                        <span class="history-date">${item.date}</span>
                        <button class="history-delete" onclick="removeHistoryItem(${index})">✕</button>
                    </div>
                `).join('');
        }

        function removeHistoryItem(index) {
            let history = JSON.parse(localStorage.getItem('passwordHistory')) || [];
            history.splice(index, 1);
            localStorage.setItem('passwordHistory', JSON.stringify(history));
            renderHistory();
        }

        function clearHistory() {
            if (confirm('🗑️ Удалить всю историю паролей?')) {
                localStorage.removeItem('passwordHistory');
                renderHistory();
            }
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        window.onload = function () {
            loadTheme();
            renderHistory();
            generatePassword();
        };
    </script>

    <script src="header.js"></script>

</body>
</html>
