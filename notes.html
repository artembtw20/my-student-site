<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конспекты</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== ШАПКА ===== -->
    <div class="header">
        <div class="logo">
            <img src="10837270.png" alt="Логотип">
            <span id="headerName" class="header-name" title="Нажми, чтобы изменить имя">Студент</span>
        </div>
        <div class="nav">
            <a href="index.html"><i data-lucide="home"></i> Главная</a>
            <a href="sitemap.html"><i data-lucide="map"></i> Все разделы</a>
            <button class="theme-toggle" onclick="toggleTheme()" id="themeToggle" title="Переключить тему">
                <i data-lucide="moon" id="themeIcon"></i>
            </button>
        </div>
    </div>

    <!-- ===== КОНТЕЙНЕР ===== -->
    <div class="container">
        <div class="page-card">

            <!-- Заголовок + кнопка "Назад" справа -->
            <div style="width: 100%; max-width: 800px; position: relative; margin: 0 auto;">
                <a href="sitemap.html" class="back-link" style="font-size: 14px; position: absolute; right: 0; top: 0;">
                    <i data-lucide="chevron-left" style="width:16px;height:16px;"></i> Назад
                </a>
            </div>

            <div class="icon"><i data-lucide="notebook-pen" style="width:64px;height:64px;"></i></div>
            <h1>Мои конспекты</h1>
            <p class="subtitle">Выбери предмет</p>

            <!-- Чипсы -->
            <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-bottom:16px;">
                <span class="chip"><i data-lucide="book" style="width:14px;height:14px;vertical-align:-2px;"></i> 4 предмета</span>
                <span class="chip chip-blue"><i data-lucide="database" style="width:14px;height:14px;vertical-align:-2px;"></i> IndexedDB</span>
                <span class="chip chip-green"><i data-lucide="infinity" style="width:14px;height:14px;vertical-align:-2px;"></i> Безлимит</span>
            </div>

            <div class="divider"></div>

            <!-- Сетка предметов -->
            <div class="subjects-grid">
                <a href="notes-matan.html" class="subject-card animate-on-scroll">
                    <span class="subject-icon"><i data-lucide="sigma" style="width:42px;height:42px;"></i></span>
                    <span class="subject-name">Математический анализ</span>
                    <span class="subject-count" id="matanCount">0 фото</span>
                </a>
                <a href="notes-discrete.html" class="subject-card animate-on-scroll">
                    <span class="subject-icon"><i data-lucide="binary" style="width:42px;height:42px;"></i></span>
                    <span class="subject-name">Дискретная алгебра</span>
                    <span class="subject-count" id="discreteCount">0 фото</span>
                </a>
                <a href="notes-physics.html" class="subject-card animate-on-scroll">
                    <span class="subject-icon"><i data-lucide="atom" style="width:42px;height:42px;"></i></span>
                    <span class="subject-name">Физика</span>
                    <span class="subject-count" id="physicsCount">0 фото</span>
                </a>
                <a href="notes-korean.html" class="subject-card animate-on-scroll">
                    <span class="subject-icon">
                        <img src="14009804.png" alt="Флаг Кореи" style="width:56px; height:42px; border-radius:4px; object-fit:cover;">
                    </span>
                    <span class="subject-name">Корейский</span>
                    <span class="subject-count" id="koreanCount">0 фото</span>
                </a>
            </div>
        </div>

        <div class="footer">
            © 2026 Мой студенческий сайт
        </div>
    </div>

    <!-- ===== КНОПКА "НАВЕРХ" ===== -->
    <button class="scroll-top" id="scrollTopBtn" onclick="scrollToTop()"><i data-lucide="arrow-up"></i></button>

    <!-- ===== JAVASCRIPT ===== -->
    <script src="db.js"></script>
    <script>
        // ===== ИКОНКИ LUCIDE =====
        function refreshIcons() {
            if (window.lucide) lucide.createIcons();
        }

        // ===== ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ =====
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            if (body.getAttribute('data-theme') === 'light') {
                body.removeAttribute('data-theme');
                icon.setAttribute('data-lucide', 'moon');
                localStorage.setItem('theme', 'dark');
            } else {
                body.setAttribute('data-theme', 'light');
                icon.setAttribute('data-lucide', 'sun');
                localStorage.setItem('theme', 'light');
            }
            refreshIcons();
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            const icon = document.getElementById('themeIcon');
            if (savedTheme === 'light') {
                document.body.setAttribute('data-theme', 'light');
                icon.setAttribute('data-lucide', 'sun');
            } else {
                icon.setAttribute('data-lucide', 'moon');
            }
            refreshIcons();
        }

        async function updateCounts() {
            const subjects = {
                matan: 'Математический анализ',
                discrete: 'Дискретная алгебра',
                physics: 'Физика',
                korean: 'Корейский'
            };

            for (const [key, name] of Object.entries(subjects)) {
                try {
                    const count = await getNotesCount(key);
                    const countEl = document.getElementById(`${key}Count`);
                    if (countEl) {
                        countEl.textContent = `${count} фото`;
                    }
                } catch (error) {
                    console.error(`Ошибка подсчёта для ${key}:`, error);
                }
            }
        }

        // ===== КНОПКА "НАВЕРХ" =====
        window.addEventListener('scroll', function () {
            const btn = document.getElementById('scrollTopBtn');
            if (window.scrollY > 300) btn.classList.add('visible');
            else btn.classList.remove('visible');
        });

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ===== АНИМАЦИЯ ПРИ СКРОЛЛЕ =====
        document.addEventListener('DOMContentLoaded', function () {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('visible');
                });
            }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });

            document.querySelectorAll('.animate-on-scroll').forEach(el => observer.observe(el));
        });

        window.onload = function () {
            loadTheme();
            updateCounts();
            refreshIcons();
            console.log('Главная страница конспектов загружена');
        };
    </script>

    <script src="header.js"></script>

</body>
</html>
